<script>

//==================================================================
// 04.1 GLOBAL VARIABLES
//==================================================================
//
// Shared configuration for the Additional Pages Template.
//
// Stores the available header logo options and the currently
// selected logo.
//
//==================================================================

const logos = [
  "images/christus.png",
  "images/temple.png"
];

let currentLogo =
  logos[Math.floor(Math.random() * logos.length)];

//##################################################################
// 05. LOGO SYSTEM
//##################################################################
//
// Provides the rotating visual identity system.
//
//##################################################################

//==================================================================
// 05.1 ROTATE LOGO
//==================================================================

function rotateLogo() {

  const box = document.getElementById("logoBox");

  currentLogo =
    currentLogo === logos[0]
      ? logos[1]
      : logos[0];

  box.style.opacity = 0;

  setTimeout(() => {

    box.innerHTML = `
      <img
        src="${currentLogo}"
        alt="Everyday Saints"
      >
    `;

    box.style.opacity = 1;

  }, 200);

}

//==================================================================
// 05.2 INITIALIZE LOGO SYSTEM
//==================================================================

document.addEventListener("DOMContentLoaded", () => {

  const box = document.getElementById("logoBox");

  box.innerHTML = `
    <img
      src="${currentLogo}"
      alt="Everyday Saints"
    >
  `;

  box.addEventListener("click", () => {
    window.open(currentLogo, "_blank");
  });

  setInterval(
    rotateLogo,
    2 * 60 * 1000
  );

});

const additionalTopicsButton =
  document.getElementById("topicsButton");

if (additionalTopicsButton) {

const additionalSearchInput =
  document.getElementById("searchInput");

if (additionalSearchInput) {

  additionalSearchInput.addEventListener("keydown", function (event) {

    if (event.key !== "Enter") {
      return;
    }

    const searchTerm = additionalSearchInput.value.trim();

    if (!searchTerm) {
      return;

    window.location.href =
      "index.html?search=" + encodeURIComponent(searchTerm);

  });

//##################################################################
// 07. SOURCES DIRECTORY SYSTEM
//##################################################################
//
// Loads the existing root-level /20sources.json registry.
//
// Builds an alphabetical directory of source cards.
//
// Does not fetch YouTube videos or modify the homepage feed.
//
//##################################################################

//==================================================================
// 07.1 SOURCES JSON CONFIGURATION
//==================================================================

const sourcesRegistryUrl = "/20sources.json";

//==================================================================
// 07.2 LOAD SOURCES DATA
//==================================================================

async function loadSourcesData() {

  const response = await fetch(sourcesRegistryUrl, {
    cache: "no-cache"
  });

  if (!response.ok) {
    throw new Error("Could not load the Sources registry.");
  }

  const sources = await response.json();

  if (!Array.isArray(sources)) {
    throw new Error("The Sources registry is not a list.");
  }

  return sources.filter(source =>
    source &&
    source.type === "youtube" &&
    typeof source.name === "string" &&
    typeof source.channelId === "string" &&
    source.channelId.trim()
  );

}

//==================================================================
// 07.3 RENDER SOURCES DIRECTORY
//==================================================================

function renderSourcesDirectory(sources) {

  const directory =
    document.getElementById("sourcesDirectory");

  const status =
    document.getElementById("sourcesStatus");

  directory.replaceChildren();

  const sortedSources = [...sources].sort((a, b) =>
    a.name.localeCompare(b.name, undefined, {
      sensitivity: "base"
    })
  );

  for (const source of sortedSources) {

    // Build the card container.

    const card = document.createElement("article");
    card.className = "source-card";

    // Build the card heading.

    const heading = document.createElement("div");
    heading.className = "source-card-heading";

    // Display a simple YouTube identifier.

    const icon = document.createElement("span");
    icon.className = "source-card-icon";
    icon.textContent = "YT";
    icon.setAttribute("aria-hidden", "true");

    // Display the channel name.

    const title = document.createElement("h2");
    title.className = "source-card-title";
    title.textContent = source.name;

    heading.append(icon, title);

    card.appendChild(heading);

    // Display the YouTube handle when available.

    if (
      typeof source.handle === "string" &&
      source.handle.trim()
    ) {

      const handle = document.createElement("p");
      handle.className = "source-card-handle";
      handle.textContent = source.handle;

      card.appendChild(handle);

    }

    // Construct a channel link from the Channel ID.

    const link = document.createElement("a");
    link.className = "source-card-link";

    link.href =
      "https://www.youtube.com/channel/" +
      encodeURIComponent(source.channelId.trim());

    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.textContent = "VISIT CHANNEL ↗";

    link.setAttribute(
      "aria-label",
      "Visit " + source.name +
      " on YouTube (opens in a new tab)"
    );

    card.appendChild(link);

    // Add the completed card to the directory.

    directory.appendChild(card);

  }

  // Display the current number of sources.

  status.textContent = sortedSources.length
    ? sortedSources.length + " YouTube channels"
    : "No sources are currently listed.";

}

//==================================================================
// 07.4 INITIALIZE SOURCES DIRECTORY
//==================================================================

document.addEventListener("DOMContentLoaded", async () => {

  const status =
    document.getElementById("sourcesStatus");

  try {

    const sources = await loadSourcesData();

    renderSourcesDirectory(sources);

  } catch (error) {

    console.error(
      "Everyday Saints Sources directory:",
      error
    );

    status.textContent =
      "The Sources directory is temporarily unavailable. " +
      "Please try again later.";

  }

});

//==================================================================
// END SECTION 07
//==================================================================

</script>
