//##################################################################

    box.style.opacity = 1;

}

//==================================================================
// 06.1 FETCH INDIVIDUAL FEED
//==================================================================

// Purpose:
////##################################################################
// 06. RSS FEED RETRIEVAL
//##################################################################
//
// STATUS:
// Complete

// Purpose:
//
// Retrieves content from approved RSS sources and converts it into
// a standardized format for Everyday Saints processing.

// Current:

// Uses RSS2JSON to convert RSS XML into JSON.

// Future:

// Replace with Cloudflare Worker/API for controlled retrieval.

// Retrieves one RSS source and converts returned items into the
// standard Everyday Saints article object.
//
// Input:
//
// RSS URL
//
// Output:
//
// Article objects containing:
// - Title
// - Link
// - Publication date
// - Source name
//
//==================================================================

async function fetchFeed(url) {

  try {

    const res = await fetch(
      "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(url)
    );

    const data = await res.json();

    if (!data.items) {
      return [];
    }

    const channelName =
      data.feed?.title ||
      "RSS FEED ERROR";

    return data.items.map(item => ({

      title: item.title,
      link: item.link,
      pubDate: item.pubDate,
      source: channelName

    }));

  } catch (e) {

    return [];

  }

}
//##################################################################
// 07. FEED PROCESSING
//##################################################################
//
// STATUS:
// Complete
//
// Purpose:
//
// Coordinates retrieved RSS data and prepares combined articles
// for display.
//
// Current:
//
// - Retrieves all approved feeds.
// - Combines returned articles.
// - Sorts articles by publication date.
// - Sends final collection to rendering system.
//
// Future:
//
// - Pagination.
// - Filtering.
// - Categories.
//
//##################################################################


//==================================================================
// 07.1 LOAD ALL FEEDS
//==================================================================
//
// Purpose:
//
// Retrieves all RSS sources, combines results, and prepares the
// final article collection for display.
//
// Process:
//
// 1. Requests each RSS source.
// 2. Combines returned articles.
// 3. Sorts newest articles first.
// 4. Limits displayed results.
// 5. Sends results to feed rendering.
//
//==================================================================

async function loadFeed() {

  const feed = document.getElementById("feed");

  const results = await Promise.all(
    rssFeeds.map(url => fetchFeed(url))
  );

  const allItems = results
    .flat()
    .sort((a, b) =>
      new Date(b.pubDate) - new Date(a.pubDate)
    )
    .slice(0, 20);

  renderFeed(allItems);

}
//##################################################################
// 08. FEED RENDERING
//##################################################################
//
// STATUS:
// Complete
//
// Purpose:
//
// Converts processed article data into visible feed cards within
// the Everyday Saints interface.
//
// Current:
//
// - Displays source name.
// - Displays article title.
// - Displays publication date.
// - Provides article link.
// - Displays error message when no items are available.
//
// Future:
//
// - Improved card layouts.
// - Images.
// - Source icons.
// - Categories and tags.
// - Additional article metadata.
//
//##################################################################


//==================================================================
// 08.1 RENDER FEED CARDS
//==================================================================
//
// Purpose:
//
// Creates the visible feed card structure from processed article
// objects.
//
// Input:
//
// Processed article collection.
//
// Output:
//
// HTML feed cards displayed inside the feed container.
//
//==================================================================

function renderFeed(items) {

  const feed = document.getElementById("feed");

  if (!items.length) {

    feed.innerHTML = `
      <div class="feed-item">
        <div class="source">
          RSS FEED ERROR
        </div>
        <div class="title">
          Unable to load feed items.
        </div>
      </div>
    `;

    return;

  }

  feed.innerHTML = items.map(item => `

    <div class="feed-item">

      <div class="source">
        ${item.source}
      </div>

      <div class="title">
        ${item.title}
      </div>

      <div class="meta">
        ${item.pubDate}
      </div>

      <a href="${item.link}" target="_blank">
        Open
      </a>

    </div>

  `).join("");

}
