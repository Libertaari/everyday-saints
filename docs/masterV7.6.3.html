//##################################################################
// 05. LOGO SYSTEM
//##################################################################
//
// STATUS:
// V6.3 - Updated
//
// Purpose:
//
// Provides the rotating visual identity system for the application.
//
// Current:

// - Random logo selected on page load.

//==================================================================
// 05.1 ROTATE LOGO
//==================================================================
//
// Purpose:
//
// Changes the currently displayed logo.
//
// Current:
//
// The initial logo is selected randomly when the page loads.
// After the initial selection, the logos alternate in sequence
// at the established rotation interval.
//
//==================================================================
function rotateLogo() {
  const box = document.getElementById("logoBox");

  currentLogo =
    currentLogo === logos[0]
      ? logos[1]
      : logos[0];

  box.style.opacity = 0;

  setTimeout(() => {
    box.innerHTML = `
      <img
        src="${currentLogo}"
        alt="Everyday Saints"
      >
    `;
    box.style.opacity = 1;
  }, 200);
}

// 05.2 INITIALIZE LOGO SYSTEM
//==================================================================
//
// Purpose:
//
// Starts the logo system after the page loads.
//
// Current:
//
// - Sets the initial logo.
// - Makes the logo clickable.
// - Opens the current artwork in a new browser tab.
// - Starts the two-minute rotation timer.
//
//==================================================================
document.addEventListener("DOMContentLoaded", () => {

  const box = document.getElementById("logoBox");

  box.innerHTML = `
    <img
      src="${currentLogo}"
      alt="Everyday Saints"
    >
  `;

  box.addEventListener("click", () => {
    window.open(currentLogo, "_blank");
  });

  setInterval(
    rotateLogo,
    2 * 60 * 1000
  );

});



//##################################################################
// 06. RSS FEED RETRIEVAL
//##################################################################
//
// STATUS:
// Current implementation - RSS2JSON
//
// Current:
//
// Uses RSS2JSON to convert RSS XML into JSON.
//
// Each article is converted into a standardized Everyday Saints
// article object containing:
//
// - Title
// - Link
// - Publication date
// - Source
// - Thumbnail
//
// Future:
//
// Replace RSS2JSON with a Cloudflare Worker/API.
// This will improve reliability, control, caching, and scalability.
//
//##################################################################

//==================================================================
// 06.1 FETCH INDIVIDUAL FEED
//==================================================================
//
// Input:
//
// RSS URL
//
// Output:
//
// Standard Everyday Saints article object.
//
// Thumbnail:
//
// Uses the thumbnail supplied by RSS2JSON when available.
// Returns an empty value when no thumbnail is provided.
//
//==================================================================

async function fetchFeed(url) {
  try {
    const res = await fetch(
      "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(url)
    );

    const data = await res.json();

    if (!data.items) {
      return [];
    }

    const channelName =
      data.feed?.title ||
      "RSS FEED ERROR";

    return data.items.map(item => ({
      title: item.title,
      link: item.link,
      pubDate: item.pubDate,
      source: channelName,
      thumbnail: item.thumbnail || ""
    }));

  } catch (e) {
    return [];
  }
}


//##################################################################
// 07. FEED PROCESSING
//##################################################################
//
// STATUS:
// V7 - In Progress
//
// Current:
//
// - Retrieves all feeds.
// - Combines articles.
// - Sorts newest first.
// - Preserves thumbnail data attached to each article.
// - Stores the complete sorted article set.
// - Controls the number of articles initially displayed.
//
// V7 Direction:
//
// - Support a larger initial article pool.
// - Provide a smooth progression through the available feed.
// - Prepare for additional feed content without repeatedly retrieving
//   the RSS sources.
//
// Future:
//
// - Filtering.
// - Categories.
// - Additional feed controls.
//
//##################################################################
//==================================================================
// 07.1 LOAD ALL FEEDS
//==================================================================
//
// Retrieves all RSS sources and prepares them for display.
//
// Article objects are passed through without modification so that
// data retrieved by Section 06, including thumbnails, remains
// available to Section 08 for rendering.
//
// The complete sorted article set is retained so that additional
// batches can be displayed without retrieving the feeds again.
//
//==================================================================

let allFeedItems = [];

let displayedCount = 30;

async function loadFeed() {

  const feed = document.getElementById("feed");

  const results = await Promise.all(
    rssFeeds.map(url => fetchFeed(url))
  );

  allFeedItems = results
    .flat()
    .sort((a, b) =>
      new Date(b.pubDate) - new Date(a.pubDate)
    );

  displayedCount = 30;

  renderFeed(
    allFeedItems.slice(0, displayedCount)
  );
}


//==================================================================
// 08.1 RENDER FEED CARDS
//==================================================================
//
// V7:
//
// Renders standardized Everyday Saints article cards.
//
// Displays article thumbnails when available.
//
// Articles without thumbnails continue to display normally.
//
// Each feed batch contains 30 articles.
//
// An advertisement placeholder is inserted after article 15
// and before article 16 of each batch.
//
// Additional articles are appended through the LOAD MORE control.
//
//==================================================================
function renderFeed(items) {
  const feed = document.getElementById("feed");

  if (!items.length) {
    feed.innerHTML = `
      <div class="feed-item">
        <div class="feed-content">
          <div class="source">
            RSS FEED ERROR
          </div>
          <div class="title">
            Unable to load feed items.
          </div>
        </div>
      </div>
    `;
    return;
  }

  feed.innerHTML = renderArticleBatch(items);
  renderLoadMore();
}

function renderArticleBatch(items) {
  return items.map((item, index) => `
    ${index === 15 ? `
      <div class="in-feed-ad">
        AD SPACE
      </div>
    ` : ""}
    <div class="feed-item">
      ${item.thumbnail ? `
        <img
          class="thumbnail"
          src="${item.thumbnail}"
          alt=""
        >
      ` : ""}
      <div class="feed-content">
        <div class="source">
          ${item.source}
        </div>
        <div class="title">
          ${item.title}
        </div>
        <div class="meta">
          ${item.pubDate}
        </div>
        <a
          class="open-button"
          href="${item.link}"
          target="_blank"
          rel="noopener noreferrer"
        >
          OPEN
        </a>
      </div>
    </div>
  `).join("");
}
//==================================================================
// 08.2 LOAD MORE CONTROL
//==================================================================
//
// V7:
//
// Adds a LOAD MORE button when additional articles are available.
//
// Each selection reveals the next 30 articles.
//
// Each 30-article batch contains an advertisement placeholder
// between articles 15 and 16.
//
// The existing feed remains visible while the next batch is
// appended below it.
//
//==================================================================
function renderLoadMore() {
  const existingButton =
    document.getElementById("loadMore");

  if (existingButton) {
    existingButton.remove();
  }

  if (displayedCount >= allFeedItems.length) {
    return;
  }

  const feed = document.getElementById("feed");
  const button = document.createElement("button");

  button.id = "loadMore";
  button.textContent = "LOAD MORE";

  button.addEventListener("click", () => {
    const previousCount = displayedCount;

    displayedCount += 30;

    const newItems =
      allFeedItems.slice(
        previousCount,
        displayedCount
      );

    feed.insertAdjacentHTML(
      "beforeend",
      renderArticleBatch(newItems)
    );

    renderLoadMore();
  });

  feed.appendChild(button);
}
