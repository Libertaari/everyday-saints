const rssFeeds = [

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCh1W-CtmEfxf0bS_aChaKlw",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCFNi-bt0oFbPvWvv5UmmAVQ",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCCVNFLUX8St8pSF1-kStOGQ",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UC8kOn6wIHfSo3Kj7l7hHhiQ",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCwJySRiyFIE2w99_bHvfmRA",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCn5VMWkt48I4xZLqWZ8E0fw",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UC7gSP30IlaFEn6UQhBFSKZg",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCVFMSQbMVD4wyiDZsQrLZ5g",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCJJ4TYPZCKbZonuWVpA5XLg",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UC-3WFOCWkUFQcX_1W3NjqAQ",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCpumfWNEXE5YbL5QMjg5agA",

  "https://www.youtube.com/feeds/videos.xml?channel_id=UCnmsAFGrFuGe0obW6tkEY6w"

];
//##################################################################
// 05. LOGO SYSTEM
//##################################################################
//
// STATUS:
// Complete
//
// Purpose:
//
// Provides the rotating visual identity system for the application.
//
// Current:
//
// - Random logo selected on page load.
// - Logo transition animation.
// - Automatic rotation every five minutes.
//
// Future:
//
// Replace placeholders:
// - A = House / Temple concept
// - B = Christus concept
//
//##################################################################


//==================================================================
// 05.1 ROTATE LOGO
//==================================================================
//
// Purpose:
//
// Changes the currently displayed logo.
//
// Current:
//
// Random switching prevents predictable rotation behavior.
//
//==================================================================

function rotateLogo() {
  const box = document.getElementById("logoBox");

  if (Math.random() < 0.5) {
    currentLogo =
      currentLogo === "A"
        ? "B"
        : "A";
  }

  box.style.opacity = 0;

  setTimeout(() => {
    box.textContent = currentLogo;
    box.style.opacity = 1;
  }, 200);
}


//==================================================================
// 05.2 INITIALIZE LOGO SYSTEM
//==================================================================
//
// Purpose:
//
// Starts the logo system after the page loads.
//
// Current:
//
// - Sets the initial logo.
// - Starts the five-minute rotation timer.
//
//==================================================================

document.addEventListener("DOMContentLoaded", () => {

  document
    .getElementById("logoBox")
    .textContent = currentLogo;

  setInterval(
    rotateLogo,
    5 * 60 * 1000
  );

});

//##################################################################
// 06. RSS FEED RETRIEVAL
//##################################################################
//
// STATUS:
// V4 - In Progress
//
// Current:
//
// Uses RSS2JSON to convert RSS XML into JSON.
//
// Each article is converted into a standardized Everyday Saints
// article object containing:
//
// - Title
// - Link
// - Publication date
// - Source
// - Thumbnail
//
// Future:
//
// Replace with Cloudflare Worker/API.
//
//##################################################################

//==================================================================
// 06.1 FETCH INDIVIDUAL FEED
//==================================================================
//
// Input:
//
// RSS URL
//
// Output:
//
// Standard Everyday Saints article object.
//
// Thumbnail:
//
// Uses the thumbnail supplied by RSS2JSON when available.
// Returns an empty value when no thumbnail is provided.
//
//==================================================================

async function fetchFeed(url) {
  try {
    const res = await fetch(
      "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(url)
    );

    const data = await res.json();

    if (!data.items) {
      return [];
    }

    const channelName =
      data.feed?.title ||
      "RSS FEED ERROR";

    return data.items.map(item => ({
      title: item.title,
      link: item.link,
      pubDate: item.pubDate,
      source: channelName,
      thumbnail: item.thumbnail || ""
    }));

  } catch (e) {
    return [];
  }
}
//##################################################################
// 07. FEED PROCESSING
//##################################################################
//
// STATUS:
// V5 - In Progress
//
// Current:
//
// - Retrieves all feeds.
// - Combines articles.
// - Sorts newest first.
// - Preserves thumbnail data attached to each article.
// - Stores the complete sorted article set.
// - Displays the first 20 articles initially.
//
// Future:
//
// - Load More implementation.
// - Filtering.
// - Categories.
//
//##################################################################
//==================================================================
// 07.1 LOAD ALL FEEDS
//==================================================================
//
// Retrieves all RSS sources and prepares them for display.
//
// Article objects are passed through without modification so that
// data retrieved by Section 06, including thumbnails, remains
// available to Section 08 for rendering.
//
// The complete sorted article set is retained so that additional
// batches can be displayed without retrieving the feeds again.
//
//==================================================================

let allFeedItems = [];

let displayedCount = 20;

async function loadFeed() {

  const feed = document.getElementById("feed");

  const results = await Promise.all(
    rssFeeds.map(url => fetchFeed(url))
  );

  allFeedItems = results
    .flat()
    .sort((a, b) =>
      new Date(b.pubDate) - new Date(a.pubDate)
    );

  displayedCount = 20;

  renderFeed(
    allFeedItems.slice(0, displayedCount)
  );
}

//==================================================================
// 08.1 RENDER FEED CARDS
//==================================================================
//
// V5:
//
// Displays article thumbnails when available.
//
// Articles without thumbnails continue to display normally.
//
// Initial display shows 20 articles.
//
// Additional articles are appended through the LOAD MORE button.
//
//==================================================================
function renderFeed(items) {

  const feed = document.getElementById("feed");

  if (!items.length) {
    feed.innerHTML = `
      <div class="feed-item">
        <div class="feed-content">
          <div class="source">
            RSS FEED ERROR
          </div>
          <div class="title">
            Unable to load feed items.
          </div>
        </div>
      </div>
    `;
    return;
  }

  feed.innerHTML = items.map(item => `
    <div class="feed-item">
      ${item.thumbnail ? `
        <img
          class="thumbnail"
          src="${item.thumbnail}"
          alt=""
        >
      ` : ""}
      <div class="feed-content">
        <div class="source">
          ${item.source}
        </div>
        <div class="title">
          ${item.title}
        </div>
        <div class="meta">
          ${item.pubDate}
        </div>
        <a href="${item.link}" target="_blank">
          Open
        </a>
      </div>
    </div>
  `).join("");

  renderLoadMore();
}


//==================================================================
// 08.2 LOAD MORE CONTROL
//==================================================================
//
// V5:
//
// Adds a LOAD MORE button when additional articles are available.
//
// Each selection reveals the next 20 articles.
//
// The existing feed remains visible while additional articles are
// appended to the displayed set.
//
//==================================================================
function renderLoadMore() {

  const existingButton =
    document.getElementById("loadMore");

  if (existingButton) {
    existingButton.remove();
  }

  if (displayedCount >= allFeedItems.length) {
    return;
  }

  const feed = document.getElementById("feed");

  const button = document.createElement("button");

  button.id = "loadMore";
  button.textContent = "LOAD MORE";

  button.addEventListener("click", () => {

    const previousCount = displayedCount;

    displayedCount += 20;

    const newItems =
      allFeedItems.slice(
        previousCount,
        displayedCount
      );

    feed.insertAdjacentHTML(
      "beforeend",
      newItems.map(item => `
        <div class="feed-item">
          ${item.thumbnail ? `
            <img
              class="thumbnail"
              src="${item.thumbnail}"
              alt=""
            >
          ` : ""}
          <div class="feed-content">
            <div class="source">
              ${item.source}
            </div>
            <div class="title">
              ${item.title}
            </div>
            <div class="meta">
              ${item.pubDate}
            </div>
            <a href="${item.link}" target="_blank">
              Open
            </a>
          </div>
        </div>
      `).join("")
    );

    renderLoadMore();
  });

  feed.appendChild(button);
}
