  00.1 PURPOSE
====================================================================

The FAQ page answers frequently asked questions about
Everyday Saints and how visitors can use the website.

Everyday Saints is designed as a curated discovery hub
for Latter-day Saint-related content, bringing together
material from multiple independent sources.

The FAQ page provides explanations of the site's
features, content sources, navigation, and general
operation.

This page is informational. It does not retrieve or
process the homepage's video feeds.

The page shares the site's established visual identity,
including its header, navigation, rotating logo,
advertisement containers, and footer.

<script>
//==================================================================
// 04.1 GLOBAL VARIABLES
//==================================================================
//
// Shared configuration for the Additional Pages Template.
//
// Current:
//
// Stores the available header logo options and the currently
// selected logo.
//
// The logo system supports the V7 alternating header treatment.
//
// Future:
//
// Additional application settings will be centralized here.
//
//==================================================================

const logos = [
  "images/christus.png",
  "images/temple.png"
];

let currentLogo =
  logos[Math.floor(Math.random() * logos.length)];

//##################################################################
// 05. LOGO SYSTEM
//##################################################################
//
//
// Purpose:
//
// Provides the rotating visual identity system for the application.
//
// Current:
//
// - Random logo selected on page load.
// - Christus and temple artwork alternate as the logo.
// - Logo transition animation.
// - Automatic rotation every two minutes.
//
// Future:
//
// - Additional logo artwork.
// - Expanded visual identity system.
//
//##################################################################


//==================================================================
// 05.1 ROTATE LOGO
//==================================================================
//
// Purpose:
//
// Changes the currently displayed logo.
//
// Current:
//
// The initial logo is selected randomly when the page loads.
// After the initial selection, the logos alternate in sequence
// at the established rotation interval.
//
//==================================================================
function rotateLogo() {
  const box = document.getElementById("logoBox");

  currentLogo =
    currentLogo === logos[0]
      ? logos[1]
      : logos[0];

  box.style.opacity = 0;

  setTimeout(() => {
    box.innerHTML = `
      <img
        src="${currentLogo}"
        alt="Everyday Saints"
      >
    `;
    box.style.opacity = 1;
  }, 200);
}

//==================================================================
// 05.2 INITIALIZE LOGO SYSTEM
//==================================================================

//
// Purpose:
//
// Starts the logo system after the page loads.
//
// Current:
//
// - Sets the initial logo.
// - Makes the logo clickable.
// - Opens the current artwork in a new browser tab.
// - Starts the two-minute rotation timer.
//
//==================================================================
document.addEventListener("DOMContentLoaded", () => {

  const box = document.getElementById("logoBox");

  box.innerHTML = `
    <img
      src="${currentLogo}"
      alt="Everyday Saints"
    >
  `;

  box.addEventListener("click", () => {
    window.open(currentLogo, "_blank");
  });

  setInterval(
    rotateLogo,
    2 * 60 * 1000
  );

});


//##################################################################
// 06. ADDITIONAL PAGES NAVIGATION
//##################################################################
//
// V12 - Additional Pages Master
//
// Purpose:
// Connects the shared navigation controls on informational
// pages to the corresponding functionality on the homepage.
//
// Current:
// - Topics redirects to the homepage with a topics request.
// - Search redirects to the homepage with a search term.
// - No feed retrieval or processing occurs on these pages.
//
// Dependency:
// Index must recognize the incoming URL parameters.
// That functionality will be added separately.
//
//==================================================================


//==================================================================
// 06.1 TOPICS NAVIGATION
//==================================================================
//
// Redirects visitors to the homepage and requests that
// the Topics panel be opened.
//
//==================================================================

const additionalTopicsButton =
  document.getElementById("topicsButton");

if (additionalTopicsButton) {

  additionalTopicsButton.addEventListener("click", function () {

    window.location.href = "index.html?topics=open";

  });

}


//==================================================================
// 06.2 SEARCH NAVIGATION
//==================================================================
//
// Redirects visitors to the homepage with their search term.
//
// Search executes when the visitor presses Enter.
// The homepage will read the incoming search parameter
// and apply its existing search functionality.
//
//==================================================================

const additionalSearchInput =
  document.getElementById("searchInput");

if (additionalSearchInput) {

  additionalSearchInput.addEventListener("keydown", function (event) {

    if (event.key !== "Enter") {
      return;
    }

    const searchTerm = additionalSearchInput.value.trim();

    if (!searchTerm) {
      return;
    }

    window.location.href =
      "index.html?search=" + encodeURIComponent(searchTerm);

  });

}


//==================================================================
// END SECTION 06
//==================================================================

</script>
